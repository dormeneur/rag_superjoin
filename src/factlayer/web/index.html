<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Knowledge Layer</title>
<style>
  :root {
    --bg: #fbfbf9; --panel: #fff; --ink: #1a1a18; --muted: #6b6b64;
    --line: #e4e4de; --accent: #2f5d50;
    --agree: #2f6f4f; --conflict: #a33a2a; --explained: #8a6a1f; --agree-bg: #edf5f0;
    --conflict-bg: #fbeeea; --explained-bg: #fbf5e6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 22px 28px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 28px 80px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .stats { gap: 26px; margin: 18px 0 22px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase;
               letter-spacing: .06em; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px 18px; margin-bottom: 12px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 26px;
          text-align: center; color: var(--muted); background: var(--panel); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--accent); background: #f2f7f5; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel);
           border-radius: 7px; padding: 6px 13px; cursor: pointer; color: var(--ink); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tabs { margin: 22px 0 14px; }
  .verdict { font-size: 11px; font-weight: 600; letter-spacing: .07em; padding: 3px 8px;
             border-radius: 5px; text-transform: uppercase; }
  .CORROBORATES { color: var(--agree); background: var(--agree-bg); }
  .CONTRADICTS { color: var(--conflict); background: var(--conflict-bg); }
  .RECONCILABLE { color: var(--explained); background: var(--explained-bg); }
  .why { margin: 10px 0 12px; }
  .evidence { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
  .evidence > div { display: flex; flex-direction: column; }
  .evidence blockquote { margin-top: auto; }
  @media (max-width: 720px) { .evidence { grid-template-columns: 1fr; } }
  blockquote { margin: 6px 0 0; padding: 9px 12px; background: #f6f6f2; border-left: 3px solid var(--line);
               border-radius: 0 5px 5px 0; font-size: 13.5px; }
  .src { font-size: 12px; color: var(--muted); }
  .val { font-variant-numeric: tabular-nums; font-weight: 600; }
  .pill { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line);
          border-radius: 20px; padding: 1px 9px; margin-right: 5px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase;
       letter-spacing: .05em; }
  input[type=search] { font: inherit; padding: 6px 11px; border: 1px solid var(--line);
                       border-radius: 7px; background: var(--panel); min-width: 240px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .warn { color: var(--conflict); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  pre { background: #f6f6f2; padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Fact Knowledge Layer</h1>
  <div class="sub">Facts pulled from PDFs, tied to the sentence they came from, and compared across documents.</div>
</header>

<main>
  <div class="row stats" id="stats"></div>

  <div class="drop" id="drop">
    <b>Drop a PDF here</b> or click to choose one.
    <div class="sub" id="uploadNote">Each upload is added to the existing knowledge layer, not a fresh one.</div>
  </div>

  <div class="row tabs">
    <button data-tab="relations" class="on">Relationships</button>
    <button data-tab="facts">Facts</button>
    <button data-tab="quarantine">Quarantined</button>
    <button data-tab="documents">Documents</button>
    <span style="flex:1"></span>
    <input type="search" id="search" placeholder="Search facts…">
  </div>

  <div class="row" id="filters" style="margin-bottom:14px"></div>
  <div id="view"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let tab = "relations";
let verdictFilter = "";

const get = (url) => fetch(url).then((r) => r.json());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function number(claim) {
  if (claim.value_num === null || claim.value_num === undefined) return esc(claim.value_text || "");
  const written = claim.value_text ? esc(claim.value_text) : "";
  const unit = claim.unit === "percent" ? "%" : (claim.unit ? " " + claim.unit : "");
  const exact = claim.unit === "percent"
    ? claim.value_num + "%"
    : claim.value_num.toLocaleString("en-IN", { maximumFractionDigits: 2 }) + unit;
  return `<span class="val">${written || exact}</span>` +
         (written ? ` <span class="src">= ${esc(exact)}</span>` : "");
}

function evidence(claim) {
  if (!claim) return "<div class='src'>missing</div>";
  const scope = Object.entries(claim.scope || {})
    .map(([k, v]) => `<span class="pill">${esc(k)}: ${esc(v)}</span>`).join("");
  return `<div>
    <div>${number(claim)}</div>
    <div class="src" style="margin-top:4px">
      ${esc(claim.document?.filename || "")} · page ${claim.page_no}
      ${claim.period_label ? " · " + esc(claim.period_label) : ""}
    </div>
    <div style="margin-top:6px">${scope}</div>
    <blockquote>${esc(claim.quote)}</blockquote>
  </div>`;
}

function relationCard(rel) {
  return `<div class="card">
    <div class="row">
      <span class="verdict ${esc(rel.verdict)}">${esc(rel.verdict)}</span>
      <span class="pill">${esc(rel.reason_code)}</span>
      <span style="flex:1"></span>
      <span class="src">${esc(rel.decided_by)}</span>
    </div>
    <div class="why">${esc(rel.explanation)}</div>
    <div class="evidence">${evidence(rel.claim_a)}${evidence(rel.claim_b)}</div>
    <details style="margin-top:10px"><summary>Dimensions compared</summary>
      <pre>${esc(JSON.stringify(rel.dimension_diff, null, 2))}</pre></details>
  </div>`;
}

function factRows(facts) {
  if (!facts.length) return "<div class='empty'>Nothing here yet.</div>";
  return `<table><thead><tr>
      <th>Entity</th><th>Metric</th><th>Value</th><th>Period</th><th>Evidence</th>
    </tr></thead><tbody>` +
    facts.map((f) => `<tr>
      <td>${esc(f.entity)}</td>
      <td>${esc(f.metric)}</td>
      <td>${number(f)}</td>
      <td>${esc(f.period_label || "—")}</td>
      <td><div class="src">${esc(f.document?.filename || "")} · p${f.page_no}</div>
          <blockquote>${esc(f.quote)}</blockquote>
          ${f.quarantine_reason ? `<div class="warn src" style="margin-top:5px">${esc(f.quarantine_reason)}</div>` : ""}
      </td></tr>`).join("") + "</tbody></table>";
}

async function render() {
  const search = $("search").value.trim();
  $("filters").innerHTML = tab === "relations"
    ? ["", "CONTRADICTS", "RECONCILABLE", "CORROBORATES"].map((v) =>
        `<button data-verdict="${v}" class="${v === verdictFilter ? "on" : ""}">${v || "All"}</button>`
      ).join("")
    : "";

  const counts = await get("/api/stats");
  $("stats").innerHTML = [
    ["documents", "Documents"], ["facts", "Facts"],
    ["relations", "Relationships"], ["quarantined", "Quarantined"],
  ].map(([key, label]) =>
    `<div class="stat"><b>${counts[key]}</b><span>${label}</span></div>`).join("");

  const view = $("view");
  if (tab === "relations") {
    const rows = await get("/api/relations" + (verdictFilter ? "?verdict=" + verdictFilter : ""));
    view.innerHTML = rows.length
      ? rows.map(relationCard).join("")
      : "<div class='empty'>No relationships yet. Upload two documents that talk about the same thing.</div>";
  } else if (tab === "documents") {
    const docs = await get("/api/documents");
    view.innerHTML = docs.length ? `<table><thead><tr>
        <th>File</th><th>Title</th><th>Publisher</th><th>Dated</th><th>Pages</th><th>Status</th>
      </tr></thead><tbody>` + docs.map((d) => `<tr>
        <td>${esc(d.filename)}</td><td>${esc(d.title || "—")}</td>
        <td>${esc(d.publisher || "—")}</td><td>${esc(d.doc_date || "—")}</td>
        <td>${d.page_count}</td><td>${esc(d.status)}</td></tr>`).join("") + "</tbody></table>"
      : "<div class='empty'>No documents yet.</div>";
  } else {
    const status = tab === "quarantine" ? "quarantined" : "active";
    const query = "?status=" + status + (search ? "&search=" + encodeURIComponent(search) : "");
    view.innerHTML = factRows(await get("/api/claims" + query));
  }
}

document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach((o) => o.classList.toggle("on", o === b));
  render();
});
$("filters").onclick = (e) => {
  if (!e.target.dataset.verdict && e.target.dataset.verdict !== "") return;
  verdictFilter = e.target.dataset.verdict;
  render();
};
$("search").oninput = () => { if (tab !== "relations") render(); };

const drop = $("drop");
const picker = Object.assign(document.createElement("input"),
  { type: "file", accept: "application/pdf", hidden: true });
document.body.appendChild(picker);
drop.onclick = () => picker.click();
picker.onchange = () => picker.files[0] && upload(picker.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
};

async function upload(file) {
  const note = $("uploadNote");
  note.textContent = `Reading ${file.name}… large reports take a few minutes.`;
  const body = new FormData();
  body.append("file", file);
  const response = await fetch("/api/documents", { method: "POST", body });
  const result = await response.json();
  if (!response.ok) {
    note.innerHTML = `<span class="warn">${esc(result.detail || "Upload failed.")}</span>`;
    return;
  }
  note.textContent =
    `${file.name}: ${result.page_count} pages, ${result.claims_extracted} facts, ` +
    `${result.claims_quarantined} quarantined, ${result.relations_created} new relationships` +
    (result.note ? ` — ${result.note}` : "");
  render();
}

render();
</script>
</body>
</html>
