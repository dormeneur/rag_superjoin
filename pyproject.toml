[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factlayer"
version = "0.1.0"
description = "A fact knowledge layer: extract grounded facts from PDFs and reconcile them across documents."
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "fpdf2>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
